name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build package
        run: uv build

      - name: Lint
        if: ${{ hashFiles('src/**/*.py') != '' }}
        run: uv run ruff check .

      - name: Format check
        if: ${{ hashFiles('src/**/*.py') != '' }}
        run: uv run ruff format --check .

      - name: Type check
        if: ${{ hashFiles('src/**/*.py') != '' }}
        run: uv run mypy .

      - name: Test
        if: ${{ hashFiles('tests/**/*.py') != '' }}
        run: uv run pytest